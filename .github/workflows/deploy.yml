name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: yuxuanhu.cn
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "index.html,css/,js/,profile.jpg,selfie.jpg,luxembourg.jpg"
          target: "/var/www/yuxuanhu"
          strip_components: 0

      - name: Fix directory permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: yuxuanhu.cn
          username: admin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: find /var/www/yuxuanhu -type d -exec chmod 755 {} \;
