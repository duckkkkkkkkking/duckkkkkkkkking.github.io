name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove unwanted files
        run: rm -rf .git .github

      - name: Sync files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./
          remote_path: /var/www/yuxuanhu/
          remote_host: yuxuanhu.cn
          remote_user: admin
          remote_key: ${{ secrets.GUANGZHOUSERVERKEYFORPERSONALWEB }}

      - name: Fix directory permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: yuxuanhu.cn
          username: admin
          key: ${{ secrets.GUANGZHOUSERVERKEYFORPERSONALWEB }}
          script: find /var/www/yuxuanhu -type d -exec chmod 755 {} \;
