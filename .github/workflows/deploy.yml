name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H yuxuanhu.cn >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'Caddyfile' \
            ./ admin@yuxuanhu.cn:/var/www/yuxuanhu/

      - name: Fix directory permissions
        run: |
          ssh admin@yuxuanhu.cn "find /var/www/yuxuanhu -type d -exec chmod 755 {} \;"
