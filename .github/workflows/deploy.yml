name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H yuxuanhu.cn >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'Caddyfile' \
            ./ admin@yuxuanhu.cn:/var/www/yuxuanhu/

      - name: Fix directory permissions
        run: |
          ssh admin@yuxuanhu.cn "find /var/www/yuxuanhu -type d -exec chmod 755 {} \;"
