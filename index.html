<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuxuan Hu | Personal Website</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    // Set the initial theme before first paint to avoid a flash of the
    // wrong theme. A saved manual choice wins; otherwise follow the OS.
    (function () {
      try {
        var saved = localStorage.getItem('site-theme');
        var theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <!-- Top Bar: Language & Theme Toggles -->
  <header class="top-bar">
    <div class="top-bar-left"></div>
    <div class="top-bar-right">
      <button id="langToggle" class="toggle-btn" aria-label="Switch Language">
        <span class="lang-zh">中</span>
        <span class="lang-en active-lang">EN</span>
      </button>
      <button id="themeToggle" class="toggle-btn" aria-label="Switch Theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="main-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="avatar-wrapper">
          <img src="photo.jpg" alt="Yuxuan Hu" class="avatar">
        </div>
        <h2 class="name">Yuxuan Hu</h2>
        <p class="title-en title">Ph.D. Student in Microelectronics</p>
        <p class="title-zh title hidden">微电子学博士研究生</p>
        <p class="affiliation-en affiliation">HKUST(GZ)</p>
        <p class="affiliation-zh affiliation hidden">香港科技大学(广州)</p>

        <div class="contact-info">
          <div class="contact-item">
            <i class="fa-solid fa-envelope"></i>
            <a href="mailto:2153478753@qq.com">2153478753@qq.com</a>
          </div>
          <div class="contact-item">
            <i class="fa-solid fa-location-dot"></i>
            <span class="location-en">Guangzhou, China</span>
            <span class="location-zh hidden">中国·广州</span>
          </div>
        </div>

        <div class="social-links">
          <a href="https://scholar.google.com/citations?user=pDjeqScAAAAJ" class="social-link" aria-label="Google Scholar" target="_blank" rel="noopener"><i class="fa-brands fa-google-scholar"></i></a>
          <a href="https://github.com/duckkkkkkkkking" class="social-link" aria-label="GitHub" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i></a>
        </div>
      </div>
    </aside>

    <!-- Right Content Area -->
    <main class="content">
      <!-- Tab Navigation -->
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="cv">
          <span class="tab-en">CV</span>
          <span class="tab-zh hidden">简历</span>
        </button>
        <button class="tab-btn" data-tab="gallery">
          <span class="tab-en">Gallery</span>
          <span class="tab-zh hidden">相册</span>
        </button>
        <a href="https://overleaf.yuxuanhu.cn" class="tab-btn tab-link" target="_blank" rel="noopener">
          <span class="tab-en">Overleaf</span>
          <span class="tab-zh hidden">Overleaf</span>
          <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
        </a>
        <a href="https://tool.yuxuanhu.cn" class="tab-btn tab-link" target="_blank" rel="noopener">
          <span class="tab-en">Tool</span>
          <span class="tab-zh hidden">工具</span>
          <i class="fa-solid fa-arrow-up-right-from-square external-icon"></i>
        </a>
      </nav>

      <!-- Tab Content: CV -->
      <section class="tab-content active" id="tab-cv">
        <!-- English CV (from LaTeX) -->
        <div class="cv-content cv-en" id="cvEn"></div>
        <!-- Chinese CV (placeholder) -->
        <div class="cv-content cv-zh hidden" id="cvZh"></div>
      </section>

      <!-- Tab Content: Gallery -->
      <section class="tab-content" id="tab-gallery">
        <div class="gallery-grid">
          <div class="gallery-item">
            <img src="selfie.jpg" alt="Selfie" loading="lazy">
            <p class="gallery-caption gallery-caption-en">Selfie</p>
            <p class="gallery-caption gallery-caption-zh hidden">自拍</p>
          </div>
          <div class="gallery-item">
            <img src="luxembourg.jpg" alt="Luxembourg" loading="lazy">
            <p class="gallery-caption gallery-caption-en">Luxembourg</p>
            <p class="gallery-caption gallery-caption-zh hidden">卢森堡</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ICP备案号 -->
  <footer class="icp-footer">
    <a href="http://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2026108812号</a>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
